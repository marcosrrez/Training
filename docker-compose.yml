version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hybrid_athlete_postgres
    environment:
      POSTGRES_USER: hybrid_athlete
      POSTGRES_PASSWORD: hybrid_athlete_dev
      POSTGRES_DB: hybrid_athlete
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybrid_athlete"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: hybrid_athlete_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: hybrid_athlete
      MONGO_INITDB_ROOT_PASSWORD: hybrid_athlete_dev
      MONGO_INITDB_DATABASE: hybrid_athlete
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hybrid_athlete_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybrid_athlete_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://hybrid_athlete:hybrid_athlete_dev@postgres:5432/hybrid_athlete
      - MONGODB_URL=mongodb://hybrid_athlete:hybrid_athlete_dev@mongodb:27017/hybrid_athlete
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hybrid_athlete_frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
